name: Daily A-Stock Analysis

on:
  schedule:
    - cron: '0 10 * * 1-5' # 每周一至周五 UTC 10:00 (北京时间 18:00) 自动运行
  workflow_dispatch: # 支持手动点击运行

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 AI 分析脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py

      - name: 提交推送生成的 JSON 数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update daily stock analysis"
          git push