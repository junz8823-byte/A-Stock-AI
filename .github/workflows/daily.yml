name: Daily A-Stock Analysis

on:
  schedule:
    # 国际标准时间 07:30 对应 北京时间 15:30 (周一至周五)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install akshare openai requests

      - name: 运行 AI 分析脚本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: "[https://api.deepseek.com](https://api.deepseek.com)"
        run: |
          python main.py

      - name: 提交并推送生成的 JSON 数据
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "Auto: 更新每日 AI 交易情景 [skip ci]" || exit 0
          git push