name: Daily A-Stock AI Analysis

on:
  schedule:
    #  UTC 时间 07:30 相当于北京时间 15:30（股市收盘后自动运行）
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 页面上手动点击运行

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行 AI 分析脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py

      - name: 自动提交并推送更新数据到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update market data [skip ci]" && git push)