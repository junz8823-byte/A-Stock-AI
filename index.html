<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股每日AI交易情景汇总</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 text-center border-b border-slate-800 pb-6">
            <h1 class="text-3xl font-bold text-blue-400 mb-2">A股每日 AI 交易情景分析</h1>
            <p class="text-slate-400 text-sm">自动抓取盘后数据 · 5大核心交易情景拆解</p>
        </header>

        <div id="loading" class="text-center py-12 text-slate-400">正在加载最新交易情景数据...</div>
        <div id="cards-container" class="grid grid-cols-1 gap-6 hidden"></div>
    </div>

    <script>
        async function loadScenarios() {
            try {
                // 读取同目录下 data/latest.json
                const response = await fetch('./data/latest.json');
                if (!response.ok) throw new Error("尚未获取到数据文件");
                const data = await response.json();
                
                const container = document.getElementById('cards-container');
                container.innerHTML = '';
                
                data.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-lg hover:border-blue-500/50 transition-all";
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex items-center gap-3">
                                <span class="bg-blue-600/30 text-blue-400 text-xs px-2.5 py-1 rounded-full border border-blue-500/30 font-medium">
                                    ${item.type}
                                </span>
                                <h3 class="text-xl font-bold text-white">${item.name} <span class="text-slate-400 text-sm font-normal">(${item.code})</span></h3>
                            </div>
                            <span class="text-sm font-semibold text-emerald-400 bg-emerald-950/50 px-3 py-1 rounded-lg border border-emerald-800/40">
                                盈亏比: ${item.rr_ratio}
                            </span>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-4 mb-4 bg-slate-900/60 p-4 rounded-lg text-center border border-slate-800">
                            <div>
                                <div class="text-xs text-slate-500 mb-1">建议入场价</div>
                                <div class="text-base font-bold text-slate-200">${item.entry_price}</div>
                            </div>
                            <div>
                                <div class="text-xs text-slate-500 mb-1">目标价</div>
                                <div class="text-base font-bold text-red-400">${item.target_price}</div>
                            </div>
                            <div>
                                <div class="text-xs text-slate-500 mb-1">止损价</div>
                                <div class="text-base font-bold text-emerald-400">${item.stop_loss_price}</div>
                            </div>
                        </div>

                        <div class="space-y-3 text-sm">
                            <div class="bg-slate-900/30 p-3 rounded border border-slate-800">
                                <span class="text-blue-400 font-semibold block mb-1">📈 技术面依据：</span>
                                <p class="text-slate-300 leading-relaxed">${item.technical_basis}</p>
                            </div>
                            <div class="bg-slate-900/30 p-3 rounded border border-slate-800">
                                <span class="text-amber-400 font-semibold block mb-1">💡 基本面逻辑：</span>
                                <p class="text-slate-300 leading-relaxed">${item.fundamental_basis}</p>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('loading').classList.add('hidden');
                container.classList.remove('hidden');
            } catch (err) {
                document.getElementById('loading').innerHTML = `<span class="text-rose-400">数据加载失败或文件不存在。请先运行 main.py 生成数据。</span>`;
            }
        }

        loadScenarios();
    </script>
</body>
</html>
